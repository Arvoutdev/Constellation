<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Do we have a minute and change?</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #ffffff;
    color: #000000;
    font-family: "Times New Roman", Times, serif;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }

  .wrap {
    text-align: center;
    max-width: 600px;
    padding: 40px 20px;
  }

  .status {
    font-size: 28px;
    font-weight: bold;
    margin-bottom: 24px;
  }

  .status.green { color: #006400; }
  .status.red   { color: #b00000; }

  .amount {
    font-size: 56px;
    font-weight: bold;
    margin-bottom: 18px;
    letter-spacing: 1px;
  }

  .subtext {
    font-size: 18px;
    color: #000000;
  }

  .class-name {
    font-style: italic;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div id="status" class="status">Loading…</div>
    <div id="amount" class="amount">$0.00</div>
  </div>

<script>
  // Hard-coded period END times, same schedule Mon-Fri, 24hr.
  const dailyEndTimes = [
    [10, 32],  // P1 (10:00-10:32)
    [11, 9],   // P2 (10:37-11:09)
    [11, 19],  // Homeroom/Common Tutorial (11:14-11:19)
    [11, 56],  // P3 (11:24-11:56)
    [12, 32],  // Lunch (12:01-12:32)
    [13, 9],   // P4 (12:37-1:09 PM)
    [13, 46],  // P5 (1:14-1:46 PM)
    [14, 23],  // P6 (1:51-2:23 PM)
    [15, 0]    // P7 (2:28-3:00 PM)
  ];

  const weekEndTimes = {
    1: dailyEndTimes, // Monday
    2: dailyEndTimes, // Tuesday
    3: dailyEndTimes, // Wednesday
    4: dailyEndTimes, // Thursday
    5: dailyEndTimes  // Friday
  };

  function pad(n) {
    return n.toString().padStart(2, '0');
  }

  function update() {
    const now = new Date();
    const day = now.getDay();
    const statusEl = document.getElementById('status');
    const amountEl = document.getElementById('amount');

    const endTimes = weekEndTimes[day] || [];

    // Find the next period-end boundary today that is still in the future.
    let msRemaining = null;

    for (const [eh, em] of endTimes) {
      const end = new Date(now);
      end.setHours(eh, em, 0, 0);

      if (end > now) {
        msRemaining = end - now;
        break;
      }
    }

    const haveTarget = msRemaining !== null;
    const secondsRemaining = haveTarget ? msRemaining / 1000 : null;

    // "a minute and change" window: between 2 minutes and 1 minute left until the boundary
    const haveMinuteAndChange = haveTarget &&
      secondsRemaining <= 120 && secondsRemaining >= 60;

    if (haveMinuteAndChange) {
      statusEl.textContent = 'We have a minute and change.';
      statusEl.className = 'status green';
    } else {
      statusEl.textContent = "We currently don't have a minute and change.";
      statusEl.className = 'status red';
    }

    // Represent time remaining until the next period-end boundary as "change":
    // dollars = whole minutes remaining, cents = seconds remaining scaled to a 0-99 range.
    // Uses fractional (millisecond-precision) seconds and requestAnimationFrame so the
    // cents value interpolates smoothly instead of jumping once per second.
    if (haveTarget) {
      const minutesRemaining = Math.floor(secondsRemaining / 60);
      const secondsPart = secondsRemaining % 60;
      const cents = Math.floor((secondsPart / 60) * 100);
      amountEl.textContent = '$' + minutesRemaining + '.' + pad(cents);
    } else {
      amountEl.textContent = '$0.00';
    }
  }

  function tick() {
    update();
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
</script>
</body>
</html>
