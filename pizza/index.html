<!DOCTYPE html>
<html lang="en-us">

<head>
    <base href="https://arviture.com/pizza/">
    <meta charset="utf-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0" />
    <link rel="icon" type="x-icon" href="favicon.png">
    <title>Pizza Tower</title>
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1">
    </canvas>
    <div id="pauseMenuContainer" hidden>
        <div id="pauseMenuBorder">
            <div id="pauseMenu">
                <button id="resumeButton" onclick="resume()"> Resume </button>
                <button id="quitButton" onclick="quitIfSupported()"> Quit </button>
            </div>
        </div>
    </div>
    <div class="loading">
        <div class="spinner" id="spinner"></div>
        <div class="emscripten" id="status">Downloading...</div>
        <progress value="0" max="100" id="progress" hidden="1"></progress>
    </div>
    <div class="output-container" id="output-container">
        <div id="message-container">
            <div id="messages">
            </div>
        </div>
        <script>
        /*
         * Pizza Tower web loader with Cache Storage.
         *
         * Before: every page load re-downloaded all 13 game.unx parts (~254 MB) one at a
         * time, and the browser's HTTP cache usually could not keep files that large.
         * Now: each file is stored in the Cache Storage API the first time it is fetched and
         * served from there on later loads. The game itself is not changed.
         *
         *   game.unx.part1..13 -> cached, then merged into one blob URL (as before)
         *   runner.data        -> cached, handed to the runner via Module.getPreloadedPackage
         *   runner.wasm        -> cached, served through the fetch() wrapper below
         *
         * If Cache Storage is unavailable (private mode, sandboxed iframe, quota), everything
         * falls back to plain network requests, so the page still works.
         *
         * Game updated? Bump CACHE_VERSION. Old caches are deleted automatically.
         * Manual wipe from the console: ptClearCache()
         */
        (function () {
            const CACHE_PREFIX = "pizza-tower-web-";
            const CACHE_VERSION = "1";
            const CACHE_NAME = CACHE_PREFIX + CACHE_VERSION;
            const PART_COUNT = 13;
            const DOWNLOAD_CONCURRENCY = 4;

            const nativeFetch = window.fetch.bind(window);
            const absUrl = (u) => new URL(u, document.baseURI).href;
            const statusEl = document.getElementById("status");
            const progressEl = document.getElementById("progress");

            function showProgress(text, value, max) {
                if (statusEl) statusEl.textContent = text;
                if (progressEl && max) {
                    progressEl.max = max;
                    progressEl.value = value;
                    progressEl.hidden = false;
                }
            }

            // ---- Mod: "=" and "-" keys swap the game's audio for a song ---------
            // Press "="       : game audio goes silent, lap.mp3 fades in over 1 second and loops.
            // Press "=" again : lap.mp3 stops and rewinds, game audio comes back.
            // "-" does the same with lapnoise.mp3, but with no fade-in and no ding. Pressing the other key while a song is
            // playing switches to that song (game audio stays silent).
            // ding.mp3 plays whenever a song starts (not when it is stopped).
            // All three files are preloaded when the page opens.
            //
            // How the muting works: every time the game connects a Web Audio node to the
            // speakers (ctx.destination), it is redirected through one master GainNode per
            // AudioContext. Muting = setting that gain to 0. This must be installed before
            // runner.js loads, which is why it runs immediately.
            // File names are resolved against <base href>, so they sit next to index.html.
            const LAP_URL = "lap.mp3";           // "=" key
            const LAPNOISE_URL = "lapnoise.mp3"; // "-" key
            const DING_URL = "ding.mp3";         // plays on each key press
            const FADE_IN_MS = 1000;             // song fade-in time

            const masterGains = new Map(); // AudioContext -> GainNode
            let gameVolume = 1;
            const nativeConnect = AudioNode.prototype.connect;
            const nativeDisconnect = AudioNode.prototype.disconnect;

            function masterFor(ctx) {
                let gain = masterGains.get(ctx);
                if (!gain) {
                    gain = ctx.createGain();
                    gain.gain.value = gameVolume;
                    nativeConnect.call(gain, ctx.destination);
                    masterGains.set(ctx, gain);
                }
                return gain;
            }
            AudioNode.prototype.connect = function (dest, ...rest) {
                if (dest instanceof AudioDestinationNode) {
                    nativeConnect.call(this, masterFor(dest.context), ...rest);
                    return dest;
                }
                return nativeConnect.call(this, dest, ...rest);
            };
            AudioNode.prototype.disconnect = function (dest, ...rest) {
                if (dest instanceof AudioDestinationNode) {
                    const gain = masterGains.get(dest.context);
                    return gain ? nativeDisconnect.call(this, gain, ...rest) : undefined;
                }
                return nativeDisconnect.call(this, dest, ...rest);
            };
            function setGameVolume(v) {
                gameVolume = v;
                for (const gain of masterGains.values()) gain.gain.value = v;
            }

            // Preload a sound: download it fully now so pressing a key plays instantly.
            // If it can't be loaded or decoded, clip.ready stays false and it is never played.
            function makeClip(url, loop) {
                const clip = { url, ready: false, audio: new Audio(), onError: null };
                const a = clip.audio;
                a.preload = "auto";
                a.loop = loop;
                a.addEventListener("canplay", () => { clip.ready = true; });
                a.addEventListener("error", () => {
                    console.warn("[lap] " + url + " could not be loaded/decoded; it is disabled");
                    clip.ready = false;
                    if (clip.onError) clip.onError();
                });
                (async () => {
                    try {
                        const res = await nativeFetch(absUrl(url));
                        if (!res.ok) throw new Error("HTTP " + res.status);
                        a.src = URL.createObjectURL(await res.blob());
                        a.load();
                        console.log("[lap] " + url + " preloaded");
                    } catch (e) {
                        console.warn("[lap] could not load " + url + "; it is disabled:", e);
                    }
                })();
                return clip;
            }
            const lapClip = makeClip(LAP_URL, true);
            const lapNoiseClip = makeClip(LAPNOISE_URL, true);
            const dingClip = makeClip(DING_URL, false);
            lapClip.fadeIn = true;  lapClip.ding = true;   // "=" : fades in, plays ding
            lapNoiseClip.fadeIn = false; lapNoiseClip.ding = false; // "-" : starts instantly, no ding

            let activeClip = null; // the song currently playing, if any
            let fadeTimer = null;

            function endLapMode() { // stop whatever is playing and give the game its audio back
                clearInterval(fadeTimer);
                if (activeClip) {
                    activeClip.audio.pause();
                    activeClip.audio.currentTime = 0;
                    activeClip.audio.volume = 1;
                }
                activeClip = null;
                setGameVolume(1);
            }

            function startSong(clip) {
                clearInterval(fadeTimer);
                clip.audio.currentTime = 0;
                clip.audio.volume = clip.fadeIn ? 0 : 1;
                clip.audio.play().then(() => {
                    if (activeClip !== clip || !clip.fadeIn) return;
                    const t0 = performance.now(); // fade starts when playback really begins
                    fadeTimer = setInterval(() => {
                        const f = Math.min(1, (performance.now() - t0) / FADE_IN_MS);
                        clip.audio.volume = f;
                        if (f >= 1) clearInterval(fadeTimer);
                    }, 30);
                }).catch((e) => {
                    console.warn("[lap] could not play " + clip.url + ":", e);
                    if (activeClip === clip) endLapMode(); // never leave the game muted with nothing playing
                });
            }

            // If a song breaks while it is playing, restore the game audio.
            for (const clip of [lapClip, lapNoiseClip]) {
                clip.onError = () => { if (activeClip === clip) endLapMode(); };
            }

            function playDing() {
                if (!dingClip.ready) return;
                dingClip.audio.currentTime = 0;
                dingClip.audio.play().catch(() => {});
            }

            function pressSongKey(clip) {
                if (!clip.ready) {
                    console.warn("[lap] " + clip.url + " is not loaded, ignoring key");
                    return;
                }
                if (activeClip === clip) {
                    endLapMode(); // same key again: stop, rewind, game audio back (no ding)
                } else {
                    if (clip.ding) playDing(); // ding only when this song starts (not lapnoise)
                    if (activeClip) { // switching songs: stop the old one, stay muted
                        activeClip.audio.pause();
                        activeClip.audio.currentTime = 0;
                        activeClip.audio.volume = 1;
                    }
                    activeClip = clip;
                    setGameVolume(0);
                    startSong(clip);
                }
            }

            window.addEventListener("keydown", (e) => {
                if (e.repeat) return;
                if (e.code === "Equal" || e.key === "=") pressSongKey(lapClip);
                else if (e.code === "Minus" || e.key === "-") pressSongKey(lapNoiseClip);
            });

            // ---- Cache Storage ---------------------------------------------------
            let cachePromise = null;
            function openCache() {
                if (!cachePromise) {
                    cachePromise = (async () => {
                        try {
                            if (!("caches" in window)) return null;
                            for (const key of await caches.keys()) {
                                if (key.startsWith(CACHE_PREFIX) && key !== CACHE_NAME) await caches.delete(key);
                            }
                            return await caches.open(CACHE_NAME);
                        } catch (e) {
                            console.warn("[cache] Cache Storage unavailable, using network only:", e);
                            return null;
                        }
                    })();
                }
                return cachePromise;
            }

            // Returns a Response for `url`: from cache if present, otherwise downloads it,
            // stores it, and returns it.
            async function getResponse(url) {
                const key = absUrl(url);
                const cache = await openCache();
                if (cache) {
                    try {
                        const hit = await cache.match(key);
                        if (hit) { console.log("[cache] hit  ", key); return hit; }
                    } catch (e) { console.warn("[cache] read failed:", e); }
                }
                console.log("[cache] miss ", key);
                const res = await nativeFetch(key);
                if (!res.ok) throw new Error("HTTP " + res.status + " for " + key);
                if (cache) {
                    try {
                        await cache.put(key, res.clone());
                        const stored = await cache.match(key);
                        if (stored) return stored;
                    } catch (e) {
                        console.warn("[cache] could not store " + key + " (quota?):", e);
                    }
                }
                return res;
            }

            // ---- loaders ---------------------------------------------------------
            // Downloads (or loads from cache) every game.unx part, a few at a time, then
            // merges them into one blob URL, which the runner is pointed at below.
            async function loadGameUnx() {
                const blobs = new Array(PART_COUNT);
                let next = 0, done = 0;
                showProgress("Loading game data... (0/" + PART_COUNT + ")", 0, PART_COUNT);
                async function worker() {
                    while (next < PART_COUNT) {
                        const i = next++;
                        const res = await getResponse("game.unx.part" + (i + 1));
                        blobs[i] = await res.blob();
                        done++;
                        showProgress("Loading game data... (" + done + "/" + PART_COUNT + ")", done, PART_COUNT);
                    }
                }
                await Promise.all(Array.from({ length: DOWNLOAD_CONCURRENCY }, worker));
                return URL.createObjectURL(new Blob(blobs));
            }

            // Only worth preloading when we have a cache; otherwise the runner's own
            // XHR (with its progress bar) does the job.
            async function loadRunnerData() {
                if (!(await openCache())) return null;
                return (await getResponse("runner.data")).arrayBuffer();
            }

            async function warm(url) {
                if (!(await openCache())) return;
                const res = await getResponse(url);
                if (res.body && !res.bodyUsed) res.body.cancel().catch(() => {});
            }

            window.ptClearCache = async function () {
                const keys = await caches.keys();
                for (const k of keys) if (k.startsWith(CACHE_PREFIX)) await caches.delete(k);
                console.log("[cache] cleared:", keys.filter(k => k.startsWith(CACHE_PREFIX)));
            };

            // ---- boot ------------------------------------------------------------
            function loadScript(src, onload) {
                const s = document.createElement("script");
                s.src = src;
                if (onload) s.onload = onload;
                document.body.appendChild(s);
            }

            (async () => {
                try {
                    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
                } catch (e) {}

                let gameUnxUrl, runnerData;
                try {
                    [gameUnxUrl, runnerData] = await Promise.all([
                        loadGameUnx(),
                        loadRunnerData(),
                        warm("runner.wasm"),
                    ]);
                } catch (error) {
                    console.error("Failed to load game files:", error);
                    if (statusEl) statusEl.textContent = "Failed to load game files, see console";
                    return;
                }
                window.gameUnxUrl = gameUnxUrl;

                // Point the runner at the merged game.unx, and serve runner.wasm from cache.
                const wasmKey = absUrl("runner.wasm");
                window.fetch = async function (...args) {
                    let [url, options] = args;
                    if (typeof url === "string" && url.includes("game.unx")) {
                        console.log("fetch:", url);
                        url = window.gameUnxUrl;
                    } else if (url instanceof Request && url.url.includes("game.unx")) {
                        console.log("fetch request:", url.url);
                        url = new Request(window.gameUnxUrl, url);
                    } else {
                        const asString = typeof url === "string" ? url : (url instanceof Request ? url.url : String(url));
                        if (absUrl(asString) === wasmKey) {
                            try { return await getResponse("runner.wasm"); } catch (e) { /* fall through to network */ }
                        }
                    }
                    return nativeFetch(url, options);
                };

                const originalOpen = XMLHttpRequest.prototype.open;
                XMLHttpRequest.prototype.open = function (method, url, ...rest) {
                    if (String(url).includes("game.unx")) {
                        console.log("XHR:", url);
                        url = window.gameUnxUrl;
                    }
                    return originalOpen.call(this, method, url, ...rest);
                };

                // index.js defines `Module`, so hook runner.data in after it loads and
                // only then start runner.js.
                loadScript("index.js", () => {
                    if (runnerData) {
                        Module.getPreloadedPackage = function (name) {
                            if (name === "runner.data") {
                                const data = runnerData;
                                runnerData = null; // let it be freed once consumed
                                return data;
                            }
                            return null;
                        };
                    }
                    loadScript("runner.js");
                });
            })();
        })();
        </script>
<script>
/*
 * Save manager.
 *
 * Press "/" ten times (each press within 3 seconds of the last) to open the menu:
 *   - Download saves backup : saves every save file to a .json file.
 *   - Upload saves backup   : replaces the current saves with the ones from a backup file.
 *
 * Where the saves live: the game keeps them in the browser's IndexedDB, in a database
 * called "/_savedata" (object store "FILE_DATA"; one record per file, the file's bytes
 * plus a timestamp). That is what gets backed up and restored. Browser storage belongs to
 * the page's origin, so a backup made on one site address only restores that same
 * address's saves, until you upload it on the other one.
 *
 * While the menu is open the game is paused and does not see the keyboard or mouse.
 * After an upload, the page reloads so the game reads the restored saves. A safety copy
 * of the saves you are replacing is downloaded first.
 */
(function () {
    const DB_NAME = "/_savedata";
    const STORE = "FILE_DATA";
    const DB_VERSION = 21; // same schema/version the game's own file system uses
    const FORMAT = "pizza-tower-saves";
    const FORMAT_VERSION = 1;
    const PRESSES_NEEDED = 10;
    const MAX_GAP_MS = 3000;

    // ---- (de)serialising IndexedDB values to JSON --------------------------------
    // Save files are Uint8Arrays and Dates, which JSON cannot hold, so they are tagged.
    const TYPED = { Int8Array, Uint8Array, Uint8ClampedArray, Int16Array, Uint16Array, Int32Array,
        Uint32Array, Float32Array, Float64Array };
    if (typeof BigInt64Array !== "undefined") { TYPED.BigInt64Array = BigInt64Array; TYPED.BigUint64Array = BigUint64Array; }

    function toB64(bytes) {
        let s = "";
        for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
        return btoa(s);
    }
    function fromB64(b64) {
        const s = atob(b64), out = new Uint8Array(s.length);
        for (let i = 0; i < s.length; i++) out[i] = s.charCodeAt(i);
        return out;
    }
    function enc(v) {
        if (v === undefined) return { $t: "undef" };
        if (v === null || typeof v !== "object") {
            if (typeof v === "number" && !isFinite(v)) return { $t: "num", v: String(v) };
            if (typeof v === "bigint") return { $t: "bigint", v: v.toString() };
            return v;
        }
        if (v instanceof Date) return { $t: "date", v: v.getTime() };
        if (v instanceof ArrayBuffer) return { $t: "ab", b: toB64(new Uint8Array(v)) };
        if (v instanceof DataView) return { $t: "dv", b: toB64(new Uint8Array(v.buffer, v.byteOffset, v.byteLength)) };
        if (ArrayBuffer.isView(v)) {
            const name = v.constructor.name;
            if (!TYPED[name]) throw new Error("Unsupported value type " + name);
            return { $t: "ta", c: name, b: toB64(new Uint8Array(v.buffer, v.byteOffset, v.byteLength)) };
        }
        if (Array.isArray(v)) return v.map(enc);
        const proto = Object.getPrototypeOf(v);
        if (proto !== Object.prototype && proto !== null) throw new Error("Unsupported value type " + (v.constructor && v.constructor.name));
        const o = {};
        for (const k of Object.keys(v)) o[k] = enc(v[k]);
        return Object.prototype.hasOwnProperty.call(v, "$t") ? { $t: "obj", v: o } : o;
    }
    function dec(v) {
        if (v === null || typeof v !== "object") return v;
        if (Array.isArray(v)) return v.map(dec);
        switch (v.$t) {
            case undefined: break;
            case "undef": return undefined;
            case "num": return Number(v.v);
            case "bigint": return BigInt(v.v);
            case "date": return new Date(v.v);
            case "ab": return fromB64(v.b).buffer;
            case "dv": return new DataView(fromB64(v.b).buffer);
            case "ta": {
                const C = TYPED[v.c];
                if (!C) throw new Error("Unknown array type " + v.c);
                return new C(fromB64(v.b).buffer);
            }
            case "obj": v = v.v; break;
            default: throw new Error("Unknown value tag " + v.$t);
        }
        const o = {};
        for (const k of Object.keys(v)) o[k] = dec(v[k]);
        return o;
    }

    // ---- IndexedDB access -------------------------------------------------------
    // create=false: open the save database if it exists, resolve null if it does not
    //               (without creating an empty one).
    // create=true : open it, creating it exactly as the game's file system would.
    function openDb(create) {
        return new Promise((resolve, reject) => {
            let req;
            try { req = create ? indexedDB.open(DB_NAME, DB_VERSION) : indexedDB.open(DB_NAME); }
            catch (e) { return reject(e); }
            let missing = false;
            req.onupgradeneeded = () => {
                if (!create) { missing = true; req.transaction.abort(); return; }
                const db = req.result;
                const st = db.objectStoreNames.contains(STORE) ? req.transaction.objectStore(STORE) : db.createObjectStore(STORE);
                if (!st.indexNames.contains("timestamp")) st.createIndex("timestamp", "timestamp", { unique: false });
            };
            req.onsuccess = () => resolve(req.result);
            req.onerror = () => {
                if (missing) return resolve(null);
                if (create && req.error && req.error.name === "VersionError") { // exists at a newer version: just open it
                    const again = indexedDB.open(DB_NAME);
                    again.onsuccess = () => resolve(again.result);
                    again.onerror = () => reject(again.error);
                    return;
                }
                reject(req.error);
            };
        });
    }

    async function dumpSaves() {
        const db = await openDb(false);
        if (!db) return [];
        try {
            if (!db.objectStoreNames.contains(STORE)) return [];
            return await new Promise((resolve, reject) => {
                const out = [];
                let failure = null;
                const tx = db.transaction(STORE, "readonly");
                const req = tx.objectStore(STORE).openCursor();
                req.onsuccess = () => {
                    const c = req.result;
                    if (!c) return;
                    try { out.push({ key: enc(c.primaryKey), value: enc(c.value) }); }
                    catch (e) { failure = e; tx.abort(); return; }
                    c.continue();
                };
                tx.oncomplete = () => resolve(out);
                tx.onabort = tx.onerror = () => reject(failure || tx.error || new Error("Read failed"));
            });
        } finally { db.close(); }
    }

    async function replaceSaves(records) { // records: [{key, value}] already decoded
        const db = await openDb(true);
        try {
            if (!db.objectStoreNames.contains(STORE)) throw new Error("The save database has no " + STORE + " store");
            await new Promise((resolve, reject) => {
                const tx = db.transaction(STORE, "readwrite");
                const st = tx.objectStore(STORE);
                st.clear();
                for (const r of records) { if (st.keyPath === null) st.put(r.value, r.key); else st.put(r.value); }
                tx.oncomplete = resolve;
                tx.onabort = tx.onerror = () => reject(tx.error || new Error("Write failed"));
            });
            const n = await new Promise((resolve, reject) => {
                const rq = db.transaction(STORE, "readonly").objectStore(STORE).count();
                rq.onsuccess = () => resolve(rq.result);
                rq.onerror = () => reject(rq.error);
            });
            if (n !== records.length) throw new Error("Verification failed: wrote " + records.length + " records but found " + n);
        } finally { db.close(); }
    }

    function describe(records) {
        let files = 0, bytes = 0;
        for (const r of records) {
            const c = r.value && r.value.contents;
            if (c !== undefined) { files++; if (c && c.b) bytes += Math.floor(c.b.length * 3 / 4); }
        }
        const kb = bytes < 1024 ? bytes + " bytes" : (bytes / 1024).toFixed(1) + " KB";
        return files + " file" + (files === 1 ? "" : "s") + " (" + kb + ")";
    }

    function stamp() { return new Date().toISOString().replace(/\.\d+Z$/, "").replace("T", "_").replace(/:/g, "-"); }

    function downloadJson(obj, filename) {
        const blob = new Blob([JSON.stringify(obj)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 10000);
    }

    function makeBackup(records) {
        return { format: FORMAT, version: FORMAT_VERSION, created: new Date().toISOString(),
            origin: location.origin, database: DB_NAME, records };
    }

    function readFileText(file) {
        return new Promise((resolve, reject) => {
            const fr = new FileReader();
            fr.onload = () => resolve(String(fr.result));
            fr.onerror = () => reject(fr.error || new Error("Could not read the file"));
            fr.readAsText(file);
        });
    }

    function parseBackup(text) {
        let b;
        try { b = JSON.parse(text); } catch (e) { throw new Error("That file is not a valid saves backup (not JSON)."); }
        if (!b || b.format !== FORMAT || !Array.isArray(b.records)) throw new Error("That file is not a Pizza Tower saves backup.");
        if (typeof b.version !== "number" || b.version > FORMAT_VERSION) throw new Error("That backup was made by a newer version of this page.");
        for (const r of b.records) if (!r || !("key" in r) || !("value" in r)) throw new Error("The backup file is damaged.");
        return b;
    }

    // ---- UI ----------------------------------------------------------------------
    const style = document.createElement("style");
    style.textContent = [
        "#ptSaveMenu{position:fixed;inset:0;z-index:100000;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.7);font-family:'Lucida Console',Monaco,monospace}",
        "#ptSaveMenu[hidden]{display:none}",
        "#ptSaveMenu .pt-panel{box-sizing:border-box;width:min(92vw,440px);padding:32px 28px;border:1px solid #FA1E4E;border-radius:6px;color:#fff;background:linear-gradient(180deg,#2E273F 16%,rgba(46,39,63,.92) 56%,#2E273F 91%)}",
        "#ptSaveMenu h2{margin:0 0 6px;font-size:20px}",
        "#ptSaveMenu p{margin:0 0 16px;font-size:13px;line-height:1.5;opacity:.85}",
        "#ptSaveMenu button{display:block;width:100%;margin:6px 0;padding:12px 24px;font:inherit;font-size:15px;color:#fff;background:#FA1E4E;border:1px solid #FA1E4E;border-radius:6px;cursor:pointer}",
        "#ptSaveMenu button.pt-quiet{background:#FA1E4E40}",
        "#ptSaveMenu button:hover:not(:disabled){filter:brightness(1.15)}",
        "#ptSaveMenu button:disabled{opacity:.5;cursor:default}",
        "#ptSaveMenu .pt-status{min-height:1.5em;margin:12px 0 0;font-size:13px;line-height:1.5}",
        "#ptSaveMenu .pt-status.pt-error{color:#ff8a8a}",
        "#ptSaveMenu .pt-status.pt-ok{color:#bdff00}"
    ].join("\n");
    document.head.appendChild(style);

    const root = document.createElement("div");
    root.id = "ptSaveMenu";
    root.hidden = true;
    root.setAttribute("role", "dialog");
    root.setAttribute("aria-modal", "true");
    root.setAttribute("aria-label", "Save manager");
    root.innerHTML =
        '<div class="pt-panel">' +
        '<h2>Save manager</h2>' +
        '<div class="pt-main">' +
        '<p>Back up your saves to a file, or restore them from one.</p>' +
        '<button type="button" class="pt-download">Download saves backup</button>' +
        '<button type="button" class="pt-upload">Upload saves backup&hellip;</button>' +
        '<button type="button" class="pt-quiet pt-close">Close</button>' +
        '</div>' +
        '<div class="pt-confirm" hidden>' +
        '<p class="pt-confirm-text"></p>' +
        '<button type="button" class="pt-replace">Replace my saves</button>' +
        '<button type="button" class="pt-quiet pt-cancel">Cancel</button>' +
        '</div>' +
        '<input type="file" class="pt-file" accept=".json,application/json" hidden>' +
        '<div class="pt-status" role="status" aria-live="polite"></div>' +
        '</div>';
    document.body.appendChild(root);

    const $ = (sel) => root.querySelector(sel);
    const mainBox = $(".pt-main"), confirmBox = $(".pt-confirm"), confirmText = $(".pt-confirm-text");
    const statusEl = $(".pt-status"), fileInput = $(".pt-file");
    const btnDownload = $(".pt-download"), btnUpload = $(".pt-upload"), btnClose = $(".pt-close");
    const btnReplace = $(".pt-replace"), btnCancel = $(".pt-cancel");

    function setStatus(text, kind) {
        statusEl.textContent = text || "";
        statusEl.className = "pt-status" + (kind ? " pt-" + kind : "");
    }
    function setBusy(busy) {
        for (const b of [btnDownload, btnUpload, btnClose, btnReplace, btnCancel]) b.disabled = busy;
    }
    function showMain() { confirmBox.hidden = true; mainBox.hidden = false; pendingBackup = null; }

    // Keep the game from running (and from seeing keys/clicks) while the menu is open.
    let open = false, weStoppedGame = false, pendingBackup = null, busy = false;
    function canvasActive() { const c = document.getElementById("canvas"); return !!(c && c.classList.contains("active")); }
    function openMenu() {
        if (open) return;
        open = true;
        setStatus("");
        showMain();
        root.hidden = false;
        weStoppedGame = false;
        try {
            if (typeof GM_pause === "function" && canvasActive()) { GM_pause(); weStoppedGame = true; }
        } catch (e) { console.warn("[saves] could not pause the game:", e); }
        btnDownload.focus();
    }
    function closeMenu() {
        if (!open || busy) return;
        open = false;
        root.hidden = true;
        showMain();
        try {
            const gamePauseMenu = document.getElementById("pauseMenuContainer");
            if (weStoppedGame && typeof GM_unpause === "function" && !(gamePauseMenu && !gamePauseMenu.hidden)) GM_unpause();
        } catch (e) { console.warn("[saves] could not resume the game:", e); }
        weStoppedGame = false;
    }
    for (const t of ["mousedown", "mouseup", "pointerdown", "pointerup", "touchstart", "touchend", "wheel", "contextmenu"]) {
        root.addEventListener(t, (e) => e.stopPropagation());
    }

    btnClose.addEventListener("click", closeMenu);
    btnCancel.addEventListener("click", () => { showMain(); setStatus(""); });

    btnDownload.addEventListener("click", async () => {
        busy = true; setBusy(true); setStatus("Reading saves...");
        try {
            const records = await dumpSaves();
            if (records.length === 0) { setStatus("No saves found in this browser yet.", "error"); return; }
            downloadJson(makeBackup(records), "pizza-tower-saves-" + stamp() + ".json");
            setStatus("Downloaded a backup of " + describe(records) + ".", "ok");
        } catch (e) {
            console.error("[saves] backup failed:", e);
            setStatus("Backup failed: " + (e && e.message || e), "error");
        } finally { busy = false; setBusy(false); }
    });

    btnUpload.addEventListener("click", () => { fileInput.value = ""; fileInput.click(); });
    fileInput.addEventListener("change", async () => {
        const file = fileInput.files && fileInput.files[0];
        if (!file) return;
        try {
            const backup = parseBackup(await readFileText(file));
            pendingBackup = backup;
            confirmText.textContent = "Backup made " + (backup.created || "at an unknown time") + " containing " + describe(backup.records) +
                ". This will REPLACE all of your current saves. A safety copy of your current saves is downloaded first, and the page reloads afterwards.";
            mainBox.hidden = true; confirmBox.hidden = false; setStatus("");
        } catch (e) {
            setStatus(e && e.message || String(e), "error");
        }
    });

    btnReplace.addEventListener("click", async () => {
        const backup = pendingBackup;
        if (!backup) return;
        busy = true; setBusy(true);
        try {
            setStatus("Checking the backup...");
            const records = backup.records.map((r) => ({ key: dec(r.key), value: dec(r.value) })); // throws if damaged, before anything is touched
            setStatus("Saving a safety copy of your current saves...");
            const current = await dumpSaves();
            if (current.length > 0) downloadJson(makeBackup(current), "pizza-tower-saves-before-restore-" + stamp() + ".json");
            setStatus("Restoring saves...");
            await replaceSaves(records);
            setStatus("Restored " + describe(backup.records) + ". Reloading...", "ok");
            setTimeout(() => location.reload(), 800);
            setTimeout(() => { // reload did not happen (blocked by the host page?): don't leave the menu stuck
                busy = false; setBusy(false);
                showMain();
                setStatus("Restored. Please reload the page to load the restored saves.", "ok");
            }, 4000);
        } catch (e) {
            console.error("[saves] restore failed:", e);
            setStatus("Restore failed: " + (e && e.message || e), "error");
            busy = false; setBusy(false);
        }
    });

    // ---- the secret knock: "/" x10 ---------------------------------------------
    let presses = 0, lastPress = 0;
    window.addEventListener("keydown", (e) => {
        if (open) {
            if (e.key === "Escape") closeMenu();
            e.stopImmediatePropagation(); // keep every key away from the game while the menu is open
            return;
        }
        if (e.repeat || e.ctrlKey || e.metaKey || e.altKey) return;
        if (!(e.key === "/" || (e.code === "Slash" && !e.shiftKey))) return;
        const now = Date.now();
        presses = (now - lastPress <= MAX_GAP_MS) ? presses + 1 : 1;
        lastPress = now;
        if (presses >= PRESSES_NEEDED) { presses = 0; openMenu(); }
    }, true);
    window.addEventListener("keyup", (e) => { if (open) e.stopImmediatePropagation(); }, true);

    // For testing from the console: ptSaves.open()
    window.ptSaves = { open: openMenu, close: closeMenu, dump: dumpSaves };
})();
</script>
</body>

</html>
