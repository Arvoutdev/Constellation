<!DOCTYPE html>
<html lang="en-us">

<head>
    <base href="https://arviture.com/pizza/">
    <meta charset="utf-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0" />
    <link rel="icon" type="x-icon" href="favicon.png">
    <title>Pizza Tower</title>
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1">
    </canvas>
    <div id="pauseMenuContainer" hidden>
        <div id="pauseMenuBorder">
            <div id="pauseMenu">
                <button id="resumeButton" onclick="resume()"> Resume </button>
                <button id="quitButton" onclick="quitIfSupported()"> Quit </button>
            </div>
        </div>
    </div>
    <div class="loading">
        <div class="spinner" id="spinner"></div>
        <div class="emscripten" id="status">Downloading...</div>
        <progress value="0" max="100" id="progress" hidden="1"></progress>
    </div>
    <div class="output-container" id="output-container">
        <div id="message-container">
            <div id="messages">
            </div>
        </div>
        <script>
        /*
         * Pizza Tower web loader with Cache Storage.
         *
         * Before: every page load re-downloaded all 13 game.unx parts (~254 MB) one at a
         * time, and the browser's HTTP cache usually could not keep files that large.
         * Now: each file is stored in the Cache Storage API the first time it is fetched and
         * served from there on later loads. The game itself is not changed.
         *
         *   game.unx.part1..13 -> cached, then merged into one blob URL (as before)
         *   runner.data        -> cached, handed to the runner via Module.getPreloadedPackage
         *   runner.wasm        -> cached, served through the fetch() wrapper below
         *
         * If Cache Storage is unavailable (private mode, sandboxed iframe, quota), everything
         * falls back to plain network requests, so the page still works.
         *
         * Game updated? Bump CACHE_VERSION. Old caches are deleted automatically.
         * Manual wipe from the console: ptClearCache()
         */
        (function () {
            const CACHE_PREFIX = "pizza-tower-web-";
            const CACHE_VERSION = "1";
            const CACHE_NAME = CACHE_PREFIX + CACHE_VERSION;
            const PART_COUNT = 13;
            const DOWNLOAD_CONCURRENCY = 4;

            const nativeFetch = window.fetch.bind(window);
            const absUrl = (u) => new URL(u, document.baseURI).href;
            const statusEl = document.getElementById("status");
            const progressEl = document.getElementById("progress");

            function showProgress(text, value, max) {
                if (statusEl) statusEl.textContent = text;
                if (progressEl && max) {
                    progressEl.max = max;
                    progressEl.value = value;
                    progressEl.hidden = false;
                }
            }

            // ---- Mod: "=" and "-" keys swap the game's audio for a song ---------
            // Press "="       : game audio goes silent, lap.mp3 fades in over 1 second and loops.
            // Press "=" again : lap.mp3 stops and rewinds, game audio comes back.
            // "-" does the same with lapnoise.mp3. Pressing the other key while a song is
            // playing switches to that song (game audio stays silent).
            // ding.mp3 plays whenever a song starts (not when it is stopped).
            // All three files are preloaded when the page opens.
            //
            // How the muting works: every time the game connects a Web Audio node to the
            // speakers (ctx.destination), it is redirected through one master GainNode per
            // AudioContext. Muting = setting that gain to 0. This must be installed before
            // runner.js loads, which is why it runs immediately.
            // File names are resolved against <base href>, so they sit next to index.html.
            const LAP_URL = "lap.mp3";           // "=" key
            const LAPNOISE_URL = "lapnoise.mp3"; // "-" key
            const DING_URL = "ding.mp3";         // plays on each key press
            const FADE_IN_MS = 1000;             // song fade-in time

            const masterGains = new Map(); // AudioContext -> GainNode
            let gameVolume = 1;
            const nativeConnect = AudioNode.prototype.connect;
            const nativeDisconnect = AudioNode.prototype.disconnect;

            function masterFor(ctx) {
                let gain = masterGains.get(ctx);
                if (!gain) {
                    gain = ctx.createGain();
                    gain.gain.value = gameVolume;
                    nativeConnect.call(gain, ctx.destination);
                    masterGains.set(ctx, gain);
                }
                return gain;
            }
            AudioNode.prototype.connect = function (dest, ...rest) {
                if (dest instanceof AudioDestinationNode) {
                    nativeConnect.call(this, masterFor(dest.context), ...rest);
                    return dest;
                }
                return nativeConnect.call(this, dest, ...rest);
            };
            AudioNode.prototype.disconnect = function (dest, ...rest) {
                if (dest instanceof AudioDestinationNode) {
                    const gain = masterGains.get(dest.context);
                    return gain ? nativeDisconnect.call(this, gain, ...rest) : undefined;
                }
                return nativeDisconnect.call(this, dest, ...rest);
            };
            function setGameVolume(v) {
                gameVolume = v;
                for (const gain of masterGains.values()) gain.gain.value = v;
            }

            // Preload a sound: download it fully now so pressing a key plays instantly.
            // If it can't be loaded or decoded, clip.ready stays false and it is never played.
            function makeClip(url, loop) {
                const clip = { url, ready: false, audio: new Audio(), onError: null };
                const a = clip.audio;
                a.preload = "auto";
                a.loop = loop;
                a.addEventListener("canplay", () => { clip.ready = true; });
                a.addEventListener("error", () => {
                    console.warn("[lap] " + url + " could not be loaded/decoded; it is disabled");
                    clip.ready = false;
                    if (clip.onError) clip.onError();
                });
                (async () => {
                    try {
                        const res = await nativeFetch(absUrl(url));
                        if (!res.ok) throw new Error("HTTP " + res.status);
                        a.src = URL.createObjectURL(await res.blob());
                        a.load();
                        console.log("[lap] " + url + " preloaded");
                    } catch (e) {
                        console.warn("[lap] could not load " + url + "; it is disabled:", e);
                    }
                })();
                return clip;
            }
            const lapClip = makeClip(LAP_URL, true);
            const lapNoiseClip = makeClip(LAPNOISE_URL, true);
            const dingClip = makeClip(DING_URL, false);

            let activeClip = null; // the song currently playing, if any
            let fadeTimer = null;

            function endLapMode() { // stop whatever is playing and give the game its audio back
                clearInterval(fadeTimer);
                if (activeClip) {
                    activeClip.audio.pause();
                    activeClip.audio.currentTime = 0;
                    activeClip.audio.volume = 1;
                }
                activeClip = null;
                setGameVolume(1);
            }

            function startSong(clip) {
                clearInterval(fadeTimer);
                clip.audio.currentTime = 0;
                clip.audio.volume = 0;
                clip.audio.play().then(() => {
                    if (activeClip !== clip) return;
                    const t0 = performance.now(); // fade starts when playback really begins
                    fadeTimer = setInterval(() => {
                        const f = Math.min(1, (performance.now() - t0) / FADE_IN_MS);
                        clip.audio.volume = f;
                        if (f >= 1) clearInterval(fadeTimer);
                    }, 30);
                }).catch((e) => {
                    console.warn("[lap] could not play " + clip.url + ":", e);
                    if (activeClip === clip) endLapMode(); // never leave the game muted with nothing playing
                });
            }

            // If a song breaks while it is playing, restore the game audio.
            for (const clip of [lapClip, lapNoiseClip]) {
                clip.onError = () => { if (activeClip === clip) endLapMode(); };
            }

            function playDing() {
                if (!dingClip.ready) return;
                dingClip.audio.currentTime = 0;
                dingClip.audio.play().catch(() => {});
            }

            function pressSongKey(clip) {
                if (!clip.ready) {
                    console.warn("[lap] " + clip.url + " is not loaded, ignoring key");
                    return;
                }
                if (activeClip === clip) {
                    endLapMode(); // same key again: stop, rewind, game audio back (no ding)
                } else {
                    playDing(); // ding only when a song starts
                    if (activeClip) { // switching songs: stop the old one, stay muted
                        activeClip.audio.pause();
                        activeClip.audio.currentTime = 0;
                        activeClip.audio.volume = 1;
                    }
                    activeClip = clip;
                    setGameVolume(0);
                    startSong(clip);
                }
            }

            window.addEventListener("keydown", (e) => {
                if (e.repeat) return;
                if (e.code === "Equal" || e.key === "=") pressSongKey(lapClip);
                else if (e.code === "Minus" || e.key === "-") pressSongKey(lapNoiseClip);
            });

            // ---- Cache Storage ---------------------------------------------------
            let cachePromise = null;
            function openCache() {
                if (!cachePromise) {
                    cachePromise = (async () => {
                        try {
                            if (!("caches" in window)) return null;
                            for (const key of await caches.keys()) {
                                if (key.startsWith(CACHE_PREFIX) && key !== CACHE_NAME) await caches.delete(key);
                            }
                            return await caches.open(CACHE_NAME);
                        } catch (e) {
                            console.warn("[cache] Cache Storage unavailable, using network only:", e);
                            return null;
                        }
                    })();
                }
                return cachePromise;
            }

            // Returns a Response for `url`: from cache if present, otherwise downloads it,
            // stores it, and returns it.
            async function getResponse(url) {
                const key = absUrl(url);
                const cache = await openCache();
                if (cache) {
                    try {
                        const hit = await cache.match(key);
                        if (hit) { console.log("[cache] hit  ", key); return hit; }
                    } catch (e) { console.warn("[cache] read failed:", e); }
                }
                console.log("[cache] miss ", key);
                const res = await nativeFetch(key);
                if (!res.ok) throw new Error("HTTP " + res.status + " for " + key);
                if (cache) {
                    try {
                        await cache.put(key, res.clone());
                        const stored = await cache.match(key);
                        if (stored) return stored;
                    } catch (e) {
                        console.warn("[cache] could not store " + key + " (quota?):", e);
                    }
                }
                return res;
            }

            // ---- loaders ---------------------------------------------------------
            // Downloads (or loads from cache) every game.unx part, a few at a time, then
            // merges them into one blob URL, which the runner is pointed at below.
            async function loadGameUnx() {
                const blobs = new Array(PART_COUNT);
                let next = 0, done = 0;
                showProgress("Loading game data... (0/" + PART_COUNT + ")", 0, PART_COUNT);
                async function worker() {
                    while (next < PART_COUNT) {
                        const i = next++;
                        const res = await getResponse("game.unx.part" + (i + 1));
                        blobs[i] = await res.blob();
                        done++;
                        showProgress("Loading game data... (" + done + "/" + PART_COUNT + ")", done, PART_COUNT);
                    }
                }
                await Promise.all(Array.from({ length: DOWNLOAD_CONCURRENCY }, worker));
                return URL.createObjectURL(new Blob(blobs));
            }

            // Only worth preloading when we have a cache; otherwise the runner's own
            // XHR (with its progress bar) does the job.
            async function loadRunnerData() {
                if (!(await openCache())) return null;
                return (await getResponse("runner.data")).arrayBuffer();
            }

            async function warm(url) {
                if (!(await openCache())) return;
                const res = await getResponse(url);
                if (res.body && !res.bodyUsed) res.body.cancel().catch(() => {});
            }

            window.ptClearCache = async function () {
                const keys = await caches.keys();
                for (const k of keys) if (k.startsWith(CACHE_PREFIX)) await caches.delete(k);
                console.log("[cache] cleared:", keys.filter(k => k.startsWith(CACHE_PREFIX)));
            };

            // ---- boot ------------------------------------------------------------
            function loadScript(src, onload) {
                const s = document.createElement("script");
                s.src = src;
                if (onload) s.onload = onload;
                document.body.appendChild(s);
            }

            (async () => {
                try {
                    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
                } catch (e) {}

                let gameUnxUrl, runnerData;
                try {
                    [gameUnxUrl, runnerData] = await Promise.all([
                        loadGameUnx(),
                        loadRunnerData(),
                        warm("runner.wasm"),
                    ]);
                } catch (error) {
                    console.error("Failed to load game files:", error);
                    if (statusEl) statusEl.textContent = "Failed to load game files, see console";
                    return;
                }
                window.gameUnxUrl = gameUnxUrl;

                // Point the runner at the merged game.unx, and serve runner.wasm from cache.
                const wasmKey = absUrl("runner.wasm");
                window.fetch = async function (...args) {
                    let [url, options] = args;
                    if (typeof url === "string" && url.includes("game.unx")) {
                        console.log("fetch:", url);
                        url = window.gameUnxUrl;
                    } else if (url instanceof Request && url.url.includes("game.unx")) {
                        console.log("fetch request:", url.url);
                        url = new Request(window.gameUnxUrl, url);
                    } else {
                        const asString = typeof url === "string" ? url : (url instanceof Request ? url.url : String(url));
                        if (absUrl(asString) === wasmKey) {
                            try { return await getResponse("runner.wasm"); } catch (e) { /* fall through to network */ }
                        }
                    }
                    return nativeFetch(url, options);
                };

                const originalOpen = XMLHttpRequest.prototype.open;
                XMLHttpRequest.prototype.open = function (method, url, ...rest) {
                    if (String(url).includes("game.unx")) {
                        console.log("XHR:", url);
                        url = window.gameUnxUrl;
                    }
                    return originalOpen.call(this, method, url, ...rest);
                };

                // index.js defines `Module`, so hook runner.data in after it loads and
                // only then start runner.js.
                loadScript("index.js", () => {
                    if (runnerData) {
                        Module.getPreloadedPackage = function (name) {
                            if (name === "runner.data") {
                                const data = runnerData;
                                runnerData = null; // let it be freed once consumed
                                return data;
                            }
                            return null;
                        };
                    }
                    loadScript("runner.js");
                });
            })();
        })();
        </script>
</body>

</html>
